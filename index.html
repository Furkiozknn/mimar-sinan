<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="arena-game" content="mimar-sinan">
<title>Mimar Sinan</title>
<meta name="description" content="A 3D construction-physics puzzle about building Ottoman mosques: piers, arches, half-domes and weight towers against the thrust of the dome. Claude Game Arena, built by Claude Fable 5.1.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   MİMAR SİNAN: RADICAL UI/UX REBIRTH (2026-11)
   Identity: Imperial Ottoman Chief Architect (Hassa Mimarbaşı) Blueprint & Divan
   Palette: Blueprint Navy (#102136, #1A385C), İznik Glaze (#2B709C), Küfeki Limestone (#F6EFE1),
            Tezhip Gold (#C9A34A), Lead Dome (#62727F), Ink Black (#152336), Terracotta (#C23F26)
   Typography: Cinzel (Imperial Inscriptions & Titles) + JetBrains Mono (Statics & Tabular Measures)
   ========================================================================== */
:root {
  --fd: "Cinzel", Bahnschrift, "Trajan Pro", "Palatino Linotype", "Times New Roman", serif;
  --fm: "JetBrains Mono", "Share Tech Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --fb: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --fh: var(--fd); /* backward compatibility for existing code */
  --paper: #f6efe1; --paper2: #ebdcc2; --paper3: #ded0b2; --paper-hl: #fffcf5;
  --ink: #152336; --ink2: #384c66; --ink3: #657b96;
  --line: rgba(27, 55, 89, 0.28); --line2: rgba(27, 55, 89, 0.14); --grid: rgba(27, 55, 89, 0.055);
  --bp-bg: #0f2035; --bp: #1a385c; --bp2: #122842; --bp-hl: #244975; --bpline: #eef5fc;
  --bpgrid: rgba(238, 245, 252, 0.07); --bpgrid-hi: rgba(238, 245, 252, 0.14);
  --accent: #2b709c; --accent2: #3a88ba; --accent-glow: rgba(43, 112, 156, 0.35);
  --gold: #c9a34a; --gold-light: #ebd68c; --gold-dark: #967425; --gold-glow: rgba(201, 163, 74, 0.4);
  --lead: #62727f; --lead-light: #8e9ca7;
  --green: #2e7d32; --yellow: #b87c12; --red: #c0392b;
  --shadow-panel: 0 18px 45px rgba(12, 24, 40, 0.38), 0 3px 10px rgba(12, 24, 40, 0.18);
  --shadow-btn: 0 2px 6px rgba(21, 35, 54, 0.16);
  --shadow-glow: 0 0 16px rgba(201, 163, 74, 0.4);
  --sa-t: env(safe-area-inset-top, 0px); --sa-b: env(safe-area-inset-bottom, 0px);
  --sa-l: env(safe-area-inset-left, 0px); --sa-r: env(safe-area-inset-right, 0px);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #e6d6b9; color: var(--ink);
  font-family: var(--fb);
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
::selection { background: var(--accent); color: #fff; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--paper2); }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--bp); }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.bp :focus-visible { outline-color: var(--gold); }

/* Architectural drafting paper: faint 20px grid, double drafting border */
.glass {
  position: relative;
  background-color: var(--paper);
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px;
  border: 1.5px solid var(--bp);
  border-radius: 4px;
  box-shadow: var(--shadow-panel), inset 0 1px 0 rgba(255, 255, 255, 0.85);
}
.glass::before {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid var(--line2);
  border-radius: 2px;
  pointer-events: none;
}
.serif { font-family: var(--fd); letter-spacing: .08em; }
svg { display: block; }
i[data-icon] { display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center; }
i[data-icon] svg { width: 100%; height: 100%; }
.num { font-family: var(--fm); font-variant-numeric: tabular-nums; letter-spacing: .02em; }

/* Architectural drafting corner registration brackets */
.corner { position: absolute; width: 12px; height: 12px; border: 1.5px solid var(--line); pointer-events: none; z-index: 2; }
.corner.tl { left: 6px; top: 6px; border-right: 0; border-bottom: 0; }
.corner.tr { right: 6px; top: 6px; border-left: 0; border-bottom: 0; }
.corner.bl { left: 6px; bottom: 6px; border-right: 0; border-top: 0; }
.corner.br { right: 6px; bottom: 6px; border-left: 0; border-top: 0; }
.bp .corner { border-color: var(--gold); opacity: .85; }

/* Blueprint drawing sheet style */
.glass.bp {
  background-color: var(--bp-bg);
  background-image:
    linear-gradient(to right, var(--bpgrid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--bpgrid) 1px, transparent 1px),
    linear-gradient(to right, var(--bpgrid-hi) 1px, transparent 1px),
    linear-gradient(to bottom, var(--bpgrid-hi) 1px, transparent 1px);
  background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
  border: 1.5px solid rgba(238, 245, 252, 0.6);
  color: var(--bpline);
  box-shadow: 0 24px 60px rgba(6, 14, 26, 0.65), 0 4px 16px rgba(6, 14, 26, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
}
.glass.bp::before { border-color: rgba(238, 245, 252, 0.22); }

/* ==========================================================================
   TOP BAR / HUD
   ========================================================================== */
.topbar {
  position: fixed;
  top: calc(8px + var(--sa-t));
  left: calc(8px + var(--sa-l));
  right: calc(8px + var(--sa-r));
  min-height: 56px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 14px;
  z-index: 20;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
  font-family: var(--fd);
  letter-spacing: .08em;
  text-transform: uppercase;
}
.brand .logo-s {
  width: 36px;
  height: 36px;
  display: block;
  border-radius: 4px;
  overflow: hidden;
  background: var(--bp);
  color: var(--gold-light);
  padding: 3px;
  box-shadow: 0 2px 6px rgba(21, 35, 54, 0.25);
  border: 1px solid rgba(201, 163, 74, 0.45);
  flex: none;
}
.brand .logo-s svg { width: 100%; height: 100%; }
.brand span.nm {
  font-size: 16px;
  font-weight: 900;
  letter-spacing: .12em;
  color: var(--ink);
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.75);
}
.stats {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--ink2);
  min-width: 0;
  text-transform: uppercase;
  letter-spacing: .05em;
  font-family: var(--fm);
}
.stats b {
  color: var(--ink);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  font-size: 15px;
  text-transform: none;
}
.stats .lsn {
  max-width: 260px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-transform: none;
  letter-spacing: .02em;
  font-family: var(--fd);
  font-weight: 700;
  font-size: 14.5px;
  color: var(--ink);
  padding: 4px 10px;
  border-radius: 3px;
  background: rgba(27, 55, 89, 0.06);
  border: 1px solid var(--line2);
}
.mwrap {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 10px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid var(--line2);
  box-shadow: 0 1px 3px rgba(27, 55, 89, 0.05);
}
.mwrap i[data-icon] { width: 16px; height: 16px; color: var(--accent); flex: none; }
.mbar {
  display: inline-block;
  width: 88px;
  height: 11px;
  border-radius: 2px;
  background: var(--paper3);
  overflow: hidden;
  position: relative;
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.15);
}
.mbar i {
  position: absolute;
  left: 0; top: 0; bottom: 0; width: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width .25s ease-out;
}
.mbar::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(27, 55, 89, 0.35) calc(10% - 1px) 10%);
  pointer-events: none;
}
.mbar.over i { background: var(--red); }
.acts { display: flex; gap: 4px; align-items: center; }
.ibtn {
  width: 44px; height: 44px;
  border-radius: 4px;
  border: 1px solid transparent;
  background: rgba(255, 255, 255, 0.45);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink); font-weight: 700; font-size: 13.5px;
  position: relative; padding: 0; font-family: var(--fm);
  transition: all .15s ease;
}
.ibtn:hover {
  background: var(--paper-hl);
  border-color: var(--gold);
  color: var(--ink);
  transform: translateY(-1px);
  box-shadow: 0 3px 8px rgba(27, 55, 89, 0.15);
}
.ibtn:active { transform: translateY(1px); }
.ibtn.on {
  background: var(--bp);
  color: var(--gold-light);
  border-color: var(--gold);
  box-shadow: 0 0 10px var(--gold-glow);
}
.ibtn:disabled { opacity: .35; cursor: default; transform: none; }
.ibtn i[data-icon] { width: 22px; height: 22px; }
.ibtn.pulse, .tbtn.pulse {
  animation: pulse 1.2s ease-in-out infinite;
  border-color: var(--gold);
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(201, 163, 74, 0); }
  50% { box-shadow: 0 0 0 6px rgba(201, 163, 74, 0.5); }
}
.stars { display: inline-flex; gap: 3px; vertical-align: middle; }
.stars svg { width: 18px; height: 18px; }
.stars svg, .bigstars svg {
  fill: transparent; stroke: rgba(27, 55, 89, 0.4); stroke-width: 1.5;
}
.stars svg.on, .bigstars svg.on {
  fill: var(--gold); stroke: var(--gold-dark);
  filter: drop-shadow(0 1px 2px rgba(150, 116, 37, 0.4));
}

/* ==========================================================================
   REQUIREMENTS & TOASTS
   ========================================================================== */
.notes {
  position: fixed;
  left: calc(8px + var(--sa-l));
  right: calc(8px + var(--sa-r));
  top: calc(74px + var(--sa-t));
  z-index: 22;
  pointer-events: none;
}
.reqs {
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-width: 44vw;
  width: max-content;
  pointer-events: auto;
}
.req {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  padding: 6px 12px;
  border-radius: 3px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-left: 4px solid var(--ink3);
  color: var(--ink);
  font-family: var(--fm);
  width: max-content;
  max-width: 100%;
  box-shadow: 0 4px 12px rgba(20, 32, 52, 0.18);
  transition: all .2s ease;
}
.req i[data-icon] { width: 16px; height: 16px; flex: none; }
.req.ok {
  border-left-color: var(--green);
  background: #f2faee;
  color: var(--green);
  font-weight: 600;
}
.req.ok i { color: var(--green); }
.req.bad {
  border-left-color: var(--red);
  background: #fcf1ee;
  color: var(--red);
  font-weight: 600;
}
.req.bad i { color: var(--red); }

.toasts {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  width: max-content;
  max-width: 92vw;
  pointer-events: none;
}
.toast {
  padding: 10px 18px;
  border-radius: 4px;
  font-weight: 700;
  font-size: 14.5px;
  font-family: var(--fd);
  letter-spacing: .03em;
  animation: tin .25s cubic-bezier(0.16, 1, 0.3, 1);
  border-left: 4px solid var(--accent);
  color: var(--ink);
  box-shadow: 0 8px 24px rgba(20, 32, 52, 0.28);
  pointer-events: auto;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.toast::before { display: none; }
.toast.good { border-left-color: var(--green); color: var(--green); background: #f3faef; }
.toast.bad { border-left-color: var(--red); color: var(--red); background: #fcf2ee; }
.toast.info { border-left-color: var(--accent); color: var(--bp); background: #f5f9fd; }
.toast.out { opacity: 0; transform: translateY(-8px) scale(0.96); transition: all .3s ease-out; }
@keyframes tin { from { opacity: 0; transform: translateY(-12px) scale(0.95); } to { opacity: 1; transform: none; } }

/* Failure Diagnostics Panel (3-second collapse HUD) */
.fail-diag {
  position: fixed;
  left: 50%;
  top: calc(78px + var(--sa-t));
  transform: translateX(-50%) translateY(-10px);
  z-index: 28;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 18px;
  background-color: var(--bp-bg);
  background-image:
    linear-gradient(to right, var(--bpgrid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--bpgrid) 1px, transparent 1px);
  background-size: 20px 20px;
  border: 1.5px solid var(--gold);
  border-radius: 4px;
  color: var(--bpline);
  box-shadow: 0 12px 36px rgba(10, 20, 35, 0.55), 0 0 16px var(--gold-glow);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s cubic-bezier(0.16, 1, 0.3, 1), transform .25s cubic-bezier(0.16, 1, 0.3, 1);
  max-width: min(92vw, 560px);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  cursor: pointer;
}
.fail-diag.on {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}
.fail-diag-icon {
  width: 28px;
  height: 28px;
  flex: none;
  color: #ff6b59;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(192, 57, 43, 0.22);
  border: 1px solid rgba(255, 107, 89, 0.45);
  border-radius: 3px;
}
.fail-diag-icon svg { width: 18px; height: 18px; }
.fail-diag-content { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fail-diag-title {
  font-family: var(--fd);
  font-weight: 800;
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--gold-light);
  line-height: 1.2;
}
.fail-diag-msg {
  font-family: var(--fm);
  font-size: 13.5px;
  font-weight: 700;
  color: #fff;
  letter-spacing: .02em;
  line-height: 1.35;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
  word-break: break-word;
}

/* ==========================================================================
   STRESS LEGEND & PIECE TRAY
   ========================================================================== */
.legend {
  position: fixed;
  right: calc(8px + var(--sa-r));
  bottom: calc(8px + var(--sa-b));
  z-index: 17;
  padding: 10px 14px;
  font-size: 12px;
  color: var(--ink2);
  width: 170px;
  pointer-events: none;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.legend > div:first-child {
  font-family: var(--fd);
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
  border-bottom: 1px solid var(--line2);
  padding-bottom: 4px;
}
.legend .bar {
  height: 10px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--green), var(--yellow) 55%, var(--red));
  margin: 6px 0;
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.15);
}
.legend.cb .bar {
  position: relative;
  overflow: hidden;
}
.legend.cb .bar::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(21, 35, 54, 0.42) 4px, rgba(21, 35, 54, 0.42) 6px);
  mask-image: linear-gradient(90deg, transparent 40%, black 55%);
  -webkit-mask-image: linear-gradient(90deg, transparent 40%, black 55%);
  pointer-events: none;
}
.legend.cb .bar::before {
  content: "";
  position: absolute;
  top: 0; bottom: 0; right: 0; width: 28%;
  background: repeating-linear-gradient(-45deg, transparent, transparent 4px, rgba(21, 35, 54, 0.42) 4px, rgba(21, 35, 54, 0.42) 6px);
  pointer-events: none;
  z-index: 1;
}
.legend .lbl {
  display: flex;
  justify-content: space-between;
  font-family: var(--fm);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
}
.legend .keys {
  margin-top: 6px;
  line-height: 1.45;
  font-size: 11px;
  color: var(--ink3);
  border-top: 1px dashed var(--line2);
  padding-top: 4px;
}
.legend kbd {
  font: inherit;
  font-weight: 700;
  color: var(--ink);
  font-family: var(--fm);
  background: rgba(27, 55, 89, 0.08);
  padding: 1px 4px;
  border-radius: 2px;
  border: 1px solid var(--line2);
}

.tray {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(8px + var(--sa-b));
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  z-index: 20;
  max-width: calc(100vw - 16px);
  flex-wrap: wrap;
  justify-content: center;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.tray .grp {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
}
.tray .sep {
  width: 1px;
  height: 44px;
  align-self: center;
  background: var(--line);
  margin: 0 2px;
}
.tbtn {
  min-width: 62px;
  height: 66px;
  border-radius: 4px;
  border: 1.5px solid var(--line);
  background: var(--paper2);
  padding: 4px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  position: relative;
  color: var(--ink);
  transition: all .15s ease;
  box-shadow: var(--shadow-btn);
}
.tbtn:hover {
  background: var(--paper-hl);
  border-color: var(--accent);
  transform: translateY(-1.5px);
  box-shadow: 0 4px 12px rgba(27, 55, 89, 0.18);
}
.tbtn:active { transform: translateY(1px); }
.tbtn i[data-icon] { width: 32px; height: 32px; margin: auto 0; color: var(--ink); }
.tbtn small {
  position: absolute;
  top: 3px; left: 4px;
  font-size: 9.5px;
  color: var(--ink3);
  font-family: var(--fm);
  font-weight: 700;
  line-height: 1;
  background: rgba(27, 55, 89, 0.07);
  padding: 1px 3px;
  border-radius: 2px;
}
.tbtn em {
  font-style: normal;
  font-size: 11.5px;
  color: var(--ink);
  font-weight: 700;
  line-height: 1;
  font-family: var(--fm);
  letter-spacing: .02em;
  background: rgba(255, 255, 255, 0.6);
  padding: 2px 5px;
  border-radius: 2px;
  border: 1px solid var(--line2);
}
.tbtn.sel {
  border-color: var(--gold);
  background: var(--bp);
  color: var(--bpline);
  box-shadow: 0 0 0 2px var(--gold), 0 6px 16px rgba(18, 36, 58, 0.35);
  transform: translateY(-2px);
}
.tbtn.sel i[data-icon] { color: var(--gold-light); }
.tbtn.sel em {
  color: var(--gold-light);
  background: rgba(0, 0, 0, 0.25);
  border-color: rgba(201, 163, 74, 0.4);
}
.tbtn.sel small {
  color: var(--bpline);
  background: rgba(255, 255, 255, 0.15);
}
.tbtn:disabled { opacity: .35; cursor: default; transform: none; }
.tbtn.poor { opacity: .45; }
.tbtn.poor em { color: var(--red); }

.cbtn {
  width: 48px; height: 48px;
  border-radius: 4px;
  border: 1.5px solid var(--line);
  background: var(--paper2);
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0; color: var(--ink);
  transition: all .15s ease;
  box-shadow: var(--shadow-btn);
}
.cbtn:hover {
  background: var(--paper-hl);
  border-color: var(--accent);
  transform: translateY(-1.5px);
  color: var(--accent);
}
.cbtn:active { transform: translateY(1px); }
.cbtn.sel {
  border-color: var(--gold);
  background: var(--bp);
  color: var(--gold-light);
  box-shadow: 0 0 0 2px var(--gold);
}
.cbtn i[data-icon] { width: 24px; height: 24px; }

// @sim-begin
// ---------------------------------------------------------------------------
// Structural simulation: masonry pieces on a grid, thrust vectors, middle-third rule.
// Pure functions, no DOM, no Three.js, so the same code runs in the page, in the bot and in the Node test.
// Units: 1 cell = 3 m. Weights are in "stone units"; a pier weighs 6.
// ---------------------------------------------------------------------------
const PT = {
  pier:     { cost: 4, h: 2.0, weight: 6,  cap: 56, layer: 'ground', support: true },
  wall:     { cost: 2, h: 1.0, weight: 4,  cap: 32, layer: 'ground', support: true, helper: 0.3 },
  buttress: { cost: 3, h: 1.5, weight: 5,  cap: 0,  layer: 'ground', helper: 0.6 },
  minaret:  { cost: 6, h: 7.0, weight: 10, cap: 30, layer: 'ground', support: true, lone: true },
  tower:    { cost: 3, h: 0.9, weight: 6,  layer: 'top' },
  arch:     { cost: 3, weight: 4, layer: 'roof' },
  dome:     { layer: 'roof' },  // cost 3*s*s, weight 4*s*s

const ARCH_THRUST = 0.30;                       // horizontal thrust of a semicircular arch per end, as a share of its weight
const HALF_THRUST = 0.8;                        // a half-dome's outer thrust relative to a full dome's corner share (it is lower and spreads along its edge)

const key = (x, z) => x + ',' + z;

// Cells occupied by a piece: ground / top pieces take one cell, roof pieces cover several.
function footprint(p) {

function canPlace(level, pieces, p) {

    if (pt.lone && roof.has(key(p.x, p.z))) return 'occupied';

// The simulation. quake: horizontal ground acceleration as a share of g (0 = none). Returns per-piece results and a summary.

  const domeSupports = new Map();
  for (const p of pieces) {
    if (p.t === 'arch') {
      const ends = archEnds(p).map(([x, z]) => supportAt(x, z));
      if (!ends[0] || !ends[1]) { fail(p, 'unsupported'); continue; }
      if (PT[ends[0].t].h !== PT[ends[1].t].h) { fail(p, 'uneven'); continue; }
      const W = pieceWeight(p), ax = (p.r & 1) ? 0 : 1, az = (p.r & 1) ? 1 : 0;
      addLoad(ends[0], W / 2, -ax * ARCH_THRUST * W, -az * ARCH_THRUST * W, p);
      addLoad(ends[1], W / 2, ax * ARCH_THRUST * W, az * ARCH_THRUST * W, p);
    } else if (p.t === 'dome') {
      const corners = domeCorners(p).map(([x, z]) => supportAt(x, z));
      if (corners.some(c => !c)) { fail(p, 'unsupported'); continue; }
      const h = PT[corners[0].t].h;

      if (p.s >= 3 && h < 2) { fail(p, 'needsPiers'); continue; }
      const sups = []; for (const [x, z] of domePerimeter(p)) { const g = supportAt(x, z); if (g && PT[g.t].h === h) sups.push(g); }
