<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mimar Sinan</title>
<meta name="description" content="A 3D construction-physics puzzle about building Ottoman mosques: piers, arches, half-domes and weight towers against the thrust of the dome. Claude Game Arena, built by Claude Fable 5.1.">
<style>
:root{
  --bg:#1c1711; --ink:#f4ecdc; --ink2:#c8b89a; --accent:#2F6E9E; --accent2:#3b87bd; --gold:#c9a34a; --green:#5f9a58; --yellow:#d9b23c; --red:#b5452c;
  --glass:rgba(40,30,20,.68); --line:rgba(244,236,220,.14);
  --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;
  touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 10px 32px rgba(0,0,0,.4)}
.serif{font-family:Georgia,"Times New Roman",serif}
svg{display:block}
i[data-icon]{display:inline-flex;width:24px;height:24px}
i[data-icon] svg{width:100%;height:100%}

/* top bar */
.topbar{position:fixed;top:calc(8px + var(--sa-t));left:8px;right:8px;min-height:56px;display:flex;align-items:center;gap:8px;padding:4px 8px;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--gold);white-space:nowrap}
.brand .logo-s{width:30px;height:30px;display:block}
.brand .logo-s svg{width:100%;height:100%}
.brand span.nm{font-size:19px;letter-spacing:.03em}
.stats{flex:1;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink2);min-width:0}
.stats b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.stats .lsn{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mwrap{display:flex;align-items:center;gap:6px}
.mbar{display:inline-block;width:76px;height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
.mbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .25s}
.mbar.over i{background:var(--red)}
.acts{display:flex;gap:2px}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;
  justify-content:center;color:var(--ink);font-weight:700;font-size:13px;position:relative;padding:0}
.ibtn:hover{background:rgba(255,255,255,.08);border-color:var(--line)}
.ibtn.on{background:rgba(47,110,158,.45);border-color:rgba(201,163,74,.5)}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn i[data-icon]{width:24px;height:24px}
.ibtn.pulse,.tbtn.pulse{animation:pulse 1s ease-in-out infinite;border-color:var(--gold)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,163,74,0)}50%{box-shadow:0 0 0 5px rgba(201,163,74,.45)}}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars svg{width:18px;height:18px}
.stars svg,.bigstars svg{fill:transparent;stroke:rgba(255,255,255,.4);stroke-width:1.5}
.stars svg.on,.bigstars svg.on{fill:var(--gold);stroke:var(--gold)}
@media (max-width:760px){
  .topbar{flex-wrap:wrap;padding:4px 6px}
  .brand span.nm{display:none}
  .stats{gap:10px;font-size:13px;order:3;flex-basis:100%;justify-content:space-around;padding-bottom:4px}
  .stats .lsn{display:none}
  .acts{margin-left:auto}
  .mbar{width:48px}
}

/* requirement chips under the bar */
.reqs{position:fixed;left:8px;top:calc(76px + var(--sa-t));z-index:17;display:flex;flex-direction:column;gap:4px;max-width:46vw}
.req{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink2);width:max-content;max-width:100%}
.req i[data-icon]{width:16px;height:16px;flex:none}
.req.ok{color:var(--ink);border-color:rgba(95,154,88,.6)} .req.ok i{color:var(--green)}
.req.bad i{color:var(--red)}
@media (max-width:760px){.reqs{top:calc(118px + var(--sa-t))}.req{font-size:11.5px;padding:4px 8px}}

/* stress legend */
.legend{position:fixed;right:8px;bottom:calc(8px + var(--sa-b));z-index:17;padding:8px 10px;font-size:11.5px;color:var(--ink2);width:150px;pointer-events:none}
.legend .bar{height:8px;border-radius:4px;background:linear-gradient(90deg,#5fb060,#d9b23c 55%,#c23a2c);margin:4px 0}
.legend .lbl{display:flex;justify-content:space-between}
.legend .keys{margin-top:4px;line-height:1.35}
.legend kbd{font:inherit;font-weight:700;color:var(--ink)}
@media (max-width:760px){.legend{display:none}}

/* piece tray */
.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + var(--sa-b));display:flex;align-items:center;gap:6px;padding:6px 8px;z-index:20;
  max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
.tray .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center}
.tray .sep{width:1px;align-self:stretch;background:var(--line)}
.tbtn{min-width:56px;height:60px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:2px 4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative;color:var(--ink)}
.tbtn i[data-icon]{width:30px;height:30px}
.tbtn small{position:absolute;top:2px;left:5px;font-size:10px;color:var(--ink2)}
.tbtn em{font-style:normal;font-size:11px;color:var(--gold);font-weight:700;line-height:1}
.tbtn.sel{border-color:var(--gold);background:rgba(201,163,74,.18);box-shadow:0 0 0 1px var(--gold) inset}
.tbtn:disabled{opacity:.3;cursor:default}
.tbtn.poor{opacity:.5}
.cbtn{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);display:inline-flex;align-items:center;justify-content:center;padding:0}
.cbtn:hover{background:rgba(255,255,255,.14)}
.cbtn.sel{border-color:var(--gold);background:rgba(201,163,74,.18)}
.cbtn i[data-icon]{width:22px;height:22px}
.cbtn:disabled{opacity:.3;cursor:default}
.test{min-height:56px;padding:0 16px;border-radius:12px;border:1px solid rgba(201,163,74,.45);background:var(--accent);color:#fff;font-weight:700;
  display:inline-flex;align-items:center;gap:8px;font-size:15px}
.test:hover{background:var(--accent2)}
.test:disabled{opacity:.5;cursor:default}
.test i[data-icon]{width:22px;height:22px}
@media (max-width:760px){.tbtn{min-width:48px;height:54px}.tbtn i[data-icon]{width:26px;height:26px}.cbtn{width:44px;height:44px}.test{min-height:50px;padding:0 12px;font-size:14px}.test span{display:none}.tray{gap:4px;padding:5px 6px}}

/* toasts */
.toasts{position:fixed;top:calc(76px + var(--sa-t));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;
  align-items:center;z-index:25;pointer-events:none;width:max-content;max-width:92vw}
@media (max-width:760px){.toasts{top:calc(120px + var(--sa-t))}}
.toast{padding:8px 16px;border-radius:12px;font-weight:600;font-size:14.5px;animation:tin .25s ease-out;border-left:4px solid var(--gold)}
.toast.good{border-left-color:var(--green)} .toast.bad{border-left-color:var(--red)}
.toast.out{opacity:0;transform:translateY(-6px);transition:all .3s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* overlays */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(16,12,7,.5);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:30;padding:12px;overflow:auto}
.overlay.clear{background:rgba(16,12,7,.12);backdrop-filter:none;-webkit-backdrop-filter:none;align-items:flex-end;justify-content:flex-start}
.panel{padding:22px 24px;width:min(94vw,470px);max-height:calc(100vh - 24px);overflow:auto}
.panel.wide{width:min(96vw,800px)}
.panel.side{width:min(94vw,420px);margin-bottom:calc(8px + var(--sa-b))}
.panel h2{margin:0 0 12px;font-size:24px;color:var(--gold)}
.col{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);
  font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.primary{background:var(--accent);border-color:rgba(201,163,74,.45);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.w{width:100%}
.btn i[data-icon]{width:20px;height:20px}
label.sl{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
label.sl span{width:96px}
input[type=range]{flex:1;accent-color:var(--accent);height:44px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;min-width:64px;padding:0 14px;border:0;background:transparent;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.lbl{width:96px;font-size:14px;color:var(--ink2)}
.footer{margin-top:14px;font-size:12px;color:var(--ink2);text-align:center}
.footer a{color:var(--gold);text-decoration:none}
.footer a:hover{text-decoration:underline}

/* title */
.title{text-align:center;width:min(94vw,520px)}
.title .logo{width:124px;height:124px;margin:0 auto 2px}
.title .logo svg{width:100%;height:100%}
.title h1{margin:0;font-size:50px;color:var(--gold);letter-spacing:.04em;line-height:1.05}
.title .sub{margin:4px 0 10px;color:var(--ink);font-size:15px}
.title .how{font-size:13px;color:var(--ink2);margin:0 0 12px;line-height:1.45}
.title .best{font-size:14px;margin:12px 0 0;color:var(--ink)}
#loadmsg{color:var(--ink2);font-size:14px;margin:6px 0}

/* period map */
.pcards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:720px){.pcards{grid-template-columns:1fr}}
.pc{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.04)}
.pc h3{margin:0;font-size:16px;color:var(--gold)}
.pc p{margin:2px 0 8px;font-size:12px;color:var(--ink2);line-height:1.35;min-height:32px}
.pc.locked{opacity:.5}
.lv5{display:grid;grid-template-columns:1fr;gap:5px}
.lv5 button{min-height:46px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 10px;line-height:1.1;text-align:left}
.lv5 button .stars svg{width:12px;height:12px}
.lv5 button:disabled{opacity:.4;cursor:default}
.lv5 button.done{border-color:var(--green)}
.lv5 button.next{border-color:var(--gold);background:rgba(201,163,74,.15)}
.lv5 button small{font-size:10.5px;color:var(--ink2);font-weight:400;margin-right:4px}

/* brief, result */
.note{background:rgba(255,255,255,.06);border-left:3px solid var(--gold);padding:8px 12px;border-radius:0 10px 10px 0;font-size:14px;line-height:1.45}
.note b{color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.07)}
.chip i[data-icon]{width:16px;height:16px}
.chip b{color:var(--ink)}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rhead h2{margin:0;font-size:22px}
.bigstars{display:flex;gap:6px}
.bigstars svg{width:30px;height:30px}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.kv div{padding:10px 6px;border-radius:12px;background:rgba(255,255,255,.06);text-align:center}
.kv b{display:block;font-size:20px;color:var(--gold)}
.kv span{font-size:11.5px;color:var(--ink2)}
.rec{color:var(--green);font-weight:700;text-align:center;margin:4px 0}
.starlist{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);margin:4px 0 8px}
.starlist div{display:flex;align-items:center;gap:8px}
.starlist svg{width:16px;height:16px;flex:none}
.preview{width:100%;aspect-ratio:16/9;border-radius:10px;background:#2a2219;display:block;margin:0 0 8px}

#dbg{position:fixed;left:8px;bottom:calc(8px + var(--sa-b));font:12px/1.4 ui-monospace,Consolas,monospace;color:#9f9;background:rgba(0,0,0,.65);
  padding:6px 8px;white-space:pre;pointer-events:none;z-index:60;border-radius:6px;max-width:92vw;overflow:hidden}
#dbg .err{color:#f66}
</style>

</script>

<body>
<canvas id="c" tabindex="0" aria-label="Mimar Sinan building site"></canvas>

<!-- HUD -->
<div id="hud" class="topbar glass" hidden>
  <div class="brand"><span class="logo-s"></span><span class="nm">Mimar Sinan</span></div>
  <div class="stats">
    <span class="lsn" id="hLevel"></span>
    <span class="mwrap"><span data-t="stone"></span> <b id="hStone">0/0</b><span class="mbar" id="hStoneBar"><i></i></span></span>
    <span class="mwrap"><span data-t="stress"></span> <b id="hStress">0%</b></span>
    <span class="stars" id="hStars"></span>
  </div>
  <div class="acts">
    <button class="ibtn" id="bHint" data-tt="hint"><i data-icon="hint"></i></button>
    <button class="ibtn" id="bUndo" data-tt="undo"><i data-icon="undo"></i></button>
    <button class="ibtn" id="bStress" data-tt="stressView"><i data-icon="stress"></i></button>
    <button class="ibtn" id="bPause" data-tt="pause"><i data-icon="pause"></i></button>
    <button class="ibtn" id="bSound" data-tt="sound"><i data-icon="sound"></i></button>
    <button class="ibtn" id="bLang" data-tt="language">TR</button>
  </div>
</div>
<div id="reqs" class="reqs" hidden></div>
<div id="legend" class="legend glass" hidden>
  <div data-t="legendTitle"></div>
  <div class="bar"></div>
  <div class="lbl"><span data-t="safe"></span><span data-t="limit"></span></div>
  <div class="keys" id="legendKeys"></div>
</div>
<div id="tools" class="tray glass" hidden>
  <div class="grp" id="pieceGrp"></div>
  <div class="sep"></div>
  <div class="grp">
    <button class="cbtn" id="bRotate" data-tt="rotate"><i data-icon="rotate"></i></button>
    <button class="cbtn" id="bErase" data-tt="erase"><i data-icon="erase"></i></button>
  </div>
  <div class="sep"></div>
  <div class="grp"><button class="test" id="bTest"><i data-icon="scaffold"></i><span data-t="test"></span></button></div>
</div>
<div id="toasts" class="toasts"></div>

<!-- Title -->
<div id="title" class="overlay">
  <div class="panel glass title">
    <div class="logo" id="logoBig"></div>
    <h1 class="serif">Mimar Sinan</h1>
    <p class="sub" data-t="subtitle"></p>
    <p class="how" data-t="howto"></p>
    <div id="loadmsg">Yükleniyor…</div>
    <div class="col">
      <button class="btn primary w" id="bPlay" disabled><i data-icon="play"></i><span data-t="play"></span></button>
      <button class="btn w" id="bContinue" hidden><i data-icon="play"></i><span data-t="continue"></span> <small id="contInfo"></small></button>
      <div class="row" style="justify-content:center">
        <button class="btn" id="bSettings"><i data-icon="gear"></i><span data-t="settings"></span></button>
        <button class="btn" id="bLang2">EN</button>
      </div>
    </div>
    <p class="best" id="bestLine"></p>
    <p class="footer">Claude Game Arena · <a href="https://furkiozknn.github.io/" target="_blank" rel="noopener">built by Claude Fable 5.1</a></p>
  </div>
</div>

<!-- Period map -->
<div id="map" class="overlay" hidden>
  <div class="panel glass wide">
    <div class="rhead"><h2 class="serif" data-t="commissions"></h2><span class="stars" id="mapStars"></span></div>
    <div class="pcards" id="pcards"></div>
    <div class="row end" style="margin-top:12px"><button class="btn" id="bMapBack"><span data-t="mainMenu"></span></button></div>
  </div>
</div>

<!-- Commission brief -->
<div id="brief" class="overlay" hidden>
  <div class="panel glass">
    <h2 class="serif" id="brTitle"></h2>
    <div class="col">
      <div class="chips" id="brChips"></div>
      <div class="note" id="brNote"></div>
      <div class="chips" id="brPieces"></div>
    </div>
    <div class="row end" style="margin-top:12px">
      <button class="btn" id="bBrBack"><span data-t="commissions"></span></button>
      <button class="btn primary" id="bBegin"><i data-icon="play"></i><span data-t="begin"></span></button>
    </div>
  </div>
</div>

<!-- Pause -->
<div id="pause" class="overlay" hidden>
  <div class="panel glass col">
    <h2 class="serif" data-t="paused"></h2>
    <button class="btn primary w" id="bResume"><span data-t="resume"></span></button>
    <button class="btn w" id="bRestart"><span data-t="restart"></span></button>
    <button class="btn w" id="bPSettings"><span data-t="settings"></span></button>
    <button class="btn w" id="bPMenu"><span data-t="mainMenu"></span></button>
  </div>
</div>

<!-- Settings -->
<div id="settings" class="overlay" hidden>
  <div class="panel glass col">
    <h2 class="serif" data-t="settings"></h2>
    <label class="sl"><span data-t="master"></span><input type="range" id="sMaster" min="0" max="1" step="0.05"></label>
    <label class="sl"><span data-t="music"></span><input type="range" id="sMusic" min="0" max="1" step="0.05"></label>
    <label class="sl"><span data-t="effects"></span><input type="range" id="sSfx" min="0" max="1" step="0.05"></label>
    <div class="row"><span class="lbl" data-t="language"></span><div class="seg" id="segLang"><button data-v="tr">Türkçe</button><button data-v="en">English</button></div></div>
    <div class="row"><span class="lbl" data-t="quality"></span><div class="seg" id="segQ"><button data-v="low" data-t="low"></button><button data-v="high" data-t="high"></button></div></div>
    <div class="row"><span class="lbl" data-t="fullscreen"></span><button class="btn" id="bFull"><i data-icon="full"></i><span data-t="fullscreen"></span></button></div>
    <button class="btn primary w" id="bSetBack" style="margin-top:6px"><span data-t="back"></span></button>
  </div>
</div>

<!-- Result (the camera circles the mosque behind it) -->
<div id="result" class="overlay clear" hidden>
  <div class="panel glass side">
    <div class="rhead"><h2 class="serif" id="rTitle"></h2><div class="bigstars" id="rStars"></div></div>
    <p class="rec" id="rRec" hidden></p>
    <p class="note" id="rNote" style="margin:0 0 8px"></p>
    <div class="starlist" id="rList"></div>
    <div class="kv" id="rKv"></div>
    <div class="row end">
      <button class="btn" id="bRMap"><span data-t="commissions"></span></button>
      <button class="btn" id="bRetry"><i data-icon="reset"></i><span data-t="retry"></span></button>
      <button class="btn primary" id="bNext"><i data-icon="play"></i><span data-t="next"></span></button>
    </div>
  </div>
</div>

<!-- Ending -->
<div id="ending" class="overlay clear" hidden>
  <div class="panel glass side">
    <h2 class="serif" data-t="endTitle" style="font-size:26px"></h2>
    <p class="sub" data-t="endSub" style="font-size:14px;color:var(--ink2);line-height:1.45"></p>
    <div class="kv" id="eKv"></div>
    <div class="col">
      <button class="btn primary w" id="bEMap"><span data-t="commissions"></span></button>
      <button class="btn w" id="bEMenu"><span data-t="mainMenu"></span></button>
    </div>
  </div>
</div>

<div id="dbg" hidden></div>

<script>
// Error capture + loading state (classic script so it runs before the module resolves)

// @sim-begin
// ---------------------------------------------------------------------------
// Structural simulation: masonry pieces on a grid, thrust vectors, middle-third rule.
// Pure functions, no DOM, no Three.js, so the same code runs in the page, in the bot and in the Node test.
// Units: 1 cell = 3 m. Weights are in "stone units"; a pier weighs 6.
// ---------------------------------------------------------------------------
const PT = {
  pier:     { cost: 4, h: 2.0, weight: 6,  cap: 56, layer: 'ground', support: true },
  wall:     { cost: 2, h: 1.0, weight: 4,  cap: 32, layer: 'ground', support: true, helper: 0.3 },
  buttress: { cost: 3, h: 1.5, weight: 5,  cap: 0,  layer: 'ground', helper: 0.6 },
  minaret:  { cost: 6, h: 7.0, weight: 10, cap: 30, layer: 'ground', support: true, lone: true },
  tower:    { cost: 3, h: 0.9, weight: 6,  layer: 'top' },
  arch:     { cost: 3, weight: 4, layer: 'roof' },
  dome:     { layer: 'roof' },  // cost 3*s*s, weight 4*s*s
  half:     { layer: 'roof' },  // cost 2*s*s, weight 2*s*s

const ARCH_THRUST = 0.30;                       // horizontal thrust of a semicircular arch per end, as a share of its weight
const HALF_THRUST = 0.8;                        // a half-dome's outer thrust relative to a full dome's corner share (it is lower and spreads along its edge)

const halfDepth = s => Math.max(1, Math.floor(s / 2));

const key = (x, z) => x + ',' + z;

// Cells occupied by a piece: ground / top pieces take one cell, roof pieces cover several.
function footprint(p) {
  const out = [];

}

function halfInfo(p) {

  if (r === 0) { flat = [[p.x, p.z - 1], [p.x + s - 1, p.z - 1]]; outer = [[p.x, p.z + d - 1], [p.x + s - 1, p.z + d - 1]]; centre = [p.x + (s - 1) / 2, p.z - 1]; }

  else if (r === 1) { flat = [[p.x - 1, p.z], [p.x - 1, p.z + s - 1]]; outer = [[p.x + d - 1, p.z], [p.x + d - 1, p.z + s - 1]]; centre = [p.x - 1, p.z + (s - 1) / 2]; }
  else { flat = [[p.x + d, p.z], [p.x + d, p.z + s - 1]]; outer = [[p.x, p.z], [p.x, p.z + s - 1]]; centre = [p.x + d, p.z + (s - 1) / 2]; }

// Placement validation: returns null when the piece may be placed, else a reason key.
function canPlace(level, pieces, p) {
  const pt = PT[p.t]; if (!pt) return 'badPiece';
  const fp = footprint(p);
  for (const [x, z] of fp) if (x < 0 || z < 0 || x >= level.grid[0] || z >= level.grid[1]) return 'offGrid';
  const ground = new Map(), top = new Map(), roof = new Map();
  for (const q of pieces) { const l = PT[q.t].layer; for (const [x, z] of footprint(q)) (l === 'ground' ? ground : l === 'top' ? top : roof).set(key(x, z), q); }
  if (pt.layer === 'ground') {
    if (ground.has(key(p.x, p.z))) return 'occupied';
    if (level.windows && level.windows.some(([x, z]) => x === p.x && z === p.z)) return 'window';
    if (pt.lone && roof.has(key(p.x, p.z))) return 'occupied';

    const g = ground.get(key(p.x, p.z)); if (!g || g.t !== 'pier') return 'needsPier';
    if (top.has(key(p.x, p.z))) return 'occupied';

    for (const [x, z] of fp) { if (roof.has(key(x, z))) return 'occupied'; const g = ground.get(key(x, z)); if (g && g.t === 'minaret') return 'occupied'; }

// The simulation. quake: horizontal ground acceleration as a share of g (0 = none). Returns per-piece results and a summary.
function simulate(level, pieces, quake = 0) {
  const ground = new Map(), roofAt = new Map(), top = new Map();
  for (const q of pieces) { const l = PT[q.t].layer; for (const [x, z] of footprint(q)) (l === 'ground' ? ground : l === 'top' ? top : roofAt).set(key(x, z), q); }
  const res = new Map(); // piece -> { stress, status, reason, N, H:[x,z], e, limit, dir }
  const sup = new Map(); // support piece -> accumulator
  const supportAt = (x, z) => { const g = ground.get(key(x, z)); return g && PT[g.t].support ? g : null; };
  const acc = g => { let a = sup.get(g); if (!a) { a = { V: 0, Hx: 0, Hz: 0, loads: [] }; sup.set(g, a); } return a; };

  const fail = (p, reason) => res.set(p, { stress: 1.5, status: 'fail', reason });
  for (const p of pieces) if (!res.has(p)) res.set(p, { stress: 0, status: 'ok' });

  // 1. roof pieces push on their supports
  const domeSupports = new Map();
  for (const p of pieces) {
    if (p.t === 'arch') {
      const ends = archEnds(p).map(([x, z]) => supportAt(x, z));
      if (!ends[0] || !ends[1]) { fail(p, 'unsupported'); continue; }
      if (PT[ends[0].t].h !== PT[ends[1].t].h) { fail(p, 'uneven'); continue; }
      const W = pieceWeight(p), ax = (p.r & 1) ? 0 : 1, az = (p.r & 1) ? 1 : 0;
      addLoad(ends[0], W / 2, -ax * ARCH_THRUST * W, -az * ARCH_THRUST * W, p);
      addLoad(ends[1], W / 2, ax * ARCH_THRUST * W, az * ARCH_THRUST * W, p);
    } else if (p.t === 'dome') {
      const corners = domeCorners(p).map(([x, z]) => supportAt(x, z));
      if (corners.some(c => !c)) { fail(p, 'unsupported'); continue; }
      const h = PT[corners[0].t].h;

}

// Commission requirements: covered hall, main dome size, minarets, open windows. Returns a list of unmet requirement keys.
function checkRequirements(level, pieces) {
  const unmet = [];

  let uncovered = 0;
  for (const [x, z] of hallCells(level)) if (!roof.has(key(x, z))) uncovered++;
  if (uncovered) unmet.push('cover');
  const best = Math.max(0, ...pieces.filter(p => p.t === 'dome').map(p => p.s));
  if (best < level.dome) unmet.push('dome');
  if ((level.minarets || 0) > pieces.filter(p => p.t === 'minaret').length) unmet.push('minarets');
  if (level.windows) { const g = new Set(pieces.filter(p => PT[p.t].layer === 'ground').map(p => key(p.x, p.z))); if (level.windows.some(([x, z]) => g.has(key(x, z)))) unmet.push('windows'); }
  return { unmet, uncovered, bestDome: best };
}
// every cell the commission wants roofed: rectangles [x, z, w, d] in level.halls plus explicit level.cells
function hallCells(level) {

  for (const H of level.halls || []) for (let x = H[0]; x < H[0] + H[2]; x++) for (let z = H[1]; z < H[1] + H[3]; z++) add(x, z);
  for (const [x, z] of level.cells || []) add(x, z);

}
function stoneUsed(pieces) { let c = 0; for (const q of pieces) c += pieceCost(q); return c; }

// Full evaluation of a layout the way the test does it: gravity, then the earthquake if the commission has one.
function evaluate(level, pieces) {
  const req = checkRequirements(level, pieces);
  const g = simulate(level, pieces, 0);
  const q = level.quake ? simulate(level, pieces, level.quake) : null;
  const stands = !g.failed, quakeOk = q ? !q.failed : true;
  const used = stoneUsed(pieces), left = level.budget - used;

  return { req, gravity: g, quake: q, stands, quakeOk, used, left, complete, stars, starCount: stars.filter(Boolean).length };
}

    if (FLAG.debug) dbgEl.innerHTML = `fps ${DBG.fps} · js ${DBG.work} ms (max ${DBG.workMax.toFixed(1)}) · calls ${DBG.calls} · tris ${DBG.tris}\n${G.state}${G.paused ? ' (paused)' : ''} · level ${G.L ? G.li + 1 + ' ' + G.L.id : '-'} · pieces ${G.pieces.length} · worst ${G.ev ? Math.round(G.ev.gravity.worst * 100) : 0}% · test ${G.test ? G.test.phase : '-'}\nbot ${BOT.on ? BOT.levelsDone + ' done' : 'off'} · zoom ${G.camDist.toFixed(1)}\n${DBG.gpu}${window.__errs.length ? '\n<span class="err">' + window.__errs.slice(-3).join('\n') + '</span>' : ''}`;
    exportState();
  }
}
window.mimar = {};
window.mimarSim = (seconds) => { G.simming = true; const step = 1 / 30; for (let s = 0; s < seconds; s += step) tick(step); G.simming = false; exportState(); return window.mimar; };
window.mimarDebug = { G, LEVELS, PT, BOT, simulate, evaluate, canPlace, placePiece, removePiece, startTest, openBrief, beginPlay, buildMap, showEnding, buildSkyline, paintSky, renderer, scene, camera, SET, PROG };

// boot: texts, icons, verify the reference solutions one per task (also fills the loading counter)
fillIcons(); $('logoBig').innerHTML = LOGO; document.querySelector('.logo-s').innerHTML = LOGO;
applyTexts(); refreshTitle(); updateSoundIcon();
renderer.setSize(innerWidth, innerHeight); fitCamera(); goTitle(); buildSkyline(firstUnsolved());
dustGeo.setDrawRange(0, SET.quality === 'low' ? Math.floor(DUST_N / 2) : DUST_N);
requestAnimationFrame(frame);
let loadIdx = 0; const REF_OK = [];
function loadStep() {
  try { const ev = evaluate(LEVELS[loadIdx], LEVELS[loadIdx].ref); REF_OK.push(ev.complete); if (!ev.complete) window.__errs.push('reference solution ' + (loadIdx + 1) + ' does not pass'); buildGeo({ t: 'dome', s: 2 + (loadIdx % 4) }); } catch (e) { window.__errs.push('level ' + loadIdx + ': ' + e.message); }
  loadIdx++; $('loadmsg').textContent = (SET.lang === 'tr' ? 'Yükleniyor… ' : 'Loading… ') + loadIdx + '/15';
  if (loadIdx < LEVELS.length) setTimeout(loadStep, 0);
  else {
    G.loaded = true; window.__loaded = true; ASSETS.loaded = ['procedural']; window.mimar.refOk = REF_OK; $('loadmsg').hidden = true; $('bPlay').disabled = false; $('bPlay').focus(); exportState();
    if (FLAG.level >= 1 && FLAG.level <= 15) { openBrief(FLAG.level - 1); beginPlay([]); }
    if (FLAG.sim > 0) window.mimarSim(FLAG.sim);
  }
}
setTimeout(loadStep, 0);
</script>
